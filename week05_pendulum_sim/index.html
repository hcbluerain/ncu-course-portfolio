<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单摆模拟器</title>
  <style>
    :root {
      --bg: #1a1a24;
      --panel: #22222d;
      --rod: #dfe7ff;
      --bob: #7fe7ff;
      --glow: rgba(127, 231, 255, 0.55);
      --text: #edf3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    canvas {
      display: block;
      background: var(--bg);
      border-radius: 18px;
      box-shadow: 0 0 32px rgba(52, 94, 152, 0.32);
      width: min(92vw, 900px);
      height: auto;
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body>
  <canvas id="simCanvas" width="900" height="540" aria-label="单摆仿真动画"></canvas>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const anchor = { x: canvas.width / 2, y: 70 };
    const length = 200;
    const g = 9.8;
    const bobRadius = 18;

    let theta = Math.PI / 4;
    let omega = 0;
    let previousTime = 0;

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#1a1a24';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawPendulum() {
      const x = anchor.x + Math.sin(theta) * length;
      const y = anchor.y + Math.cos(theta) * length;

      // 支架
      ctx.strokeStyle = '#dfe7ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(anchor.x - 18, anchor.y);
      ctx.lineTo(anchor.x + 18, anchor.y);
      ctx.stroke();

      // 摆杆
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y);
      ctx.lineTo(x, y);
      ctx.strokeStyle = '#dfe7ff';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(223, 231, 255, 0.6)';
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 摆球发光
      const glow = ctx.createRadialGradient(x, y, 4, x, y, bobRadius + 18);
      glow.addColorStop(0, 'rgba(255,255,255,0.95)');
      glow.addColorStop(0.35, 'rgba(127,231,255,0.8)');
      glow.addColorStop(1, 'rgba(127,231,255,0)');

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, bobRadius + 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = '#7fe7ff';
      ctx.shadowBlur = 24;
      ctx.shadowColor = 'rgba(127, 231, 255, 0.8)';
      ctx.arc(x, y, bobRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function updatePhysics(dt) {
      const alpha = -(g / 60) * Math.sin(theta);
      omega += alpha * dt * 60;
      omega *= 0.999;
      theta += omega * dt * 60;
    }

    function animate(timestamp) {
      const dt = Math.min((timestamp - previousTime) / 1000 || 0.016, 0.033);
      previousTime = timestamp;

      updatePhysics(dt);
      drawBackground();
      drawPendulum();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
